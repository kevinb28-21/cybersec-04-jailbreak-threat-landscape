services:
  aegis:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - aegis-data:/app/data
    environment:
      - DEPLOYMENT_PROFILE=personal
      - EVENT_BUS_BACKEND=memory
      - LOG_LEVEL=INFO
      - API_HOST=0.0.0.0
      - API_PORT=8080
      - ML_ENABLED=true
      - WATCHDOG_ENABLED=true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  aegis-data:
